name: generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # themed to kncn23.github.io — warm neutral dots ramping to the signal
          # orange; mid-tone empty dots so it reads on light and dark GitHub alike
          outputs: |
            dist/github-snake.svg?color_snake=#c24c1b&color_dots=#a9a295,#e0b9a2,#d98d64,#cf6b35,#c24c1b

      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
