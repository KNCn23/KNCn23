<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ata Kaan Can Olcay — Embedded Systems and Edge-AI Software">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.2s step-end infinite; }
  </style>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e6d9"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1f2a3c"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="298" rx="16"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#0a0e14"/>

  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1198" height="298" fill="url(#dots)" opacity="0.55"/>
    <circle cx="1080" cy="20" r="210" fill="#58e6d9" opacity="0.08" filter="url(#soft)"/>
    <circle cx="140" cy="310" r="230" fill="#7c8cff" opacity="0.09" filter="url(#soft)"/>
    <rect x="1" y="1" width="1198" height="5" fill="url(#accent)"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#1f2a3c" stroke-width="2"/>

  <!-- left: title block -->
  <text x="70" y="95" class="mono" font-size="16" fill="#8b9bb4">~ $ whoami</text>
  <text x="68" y="152" class="mono" font-size="50" font-weight="700" fill="url(#accent)">Ata Kaan Can Olcay</text>
  <text x="70" y="192" class="mono" font-size="16" fill="#d6e2f0">Embedded Systems &amp; Edge-AI Software &#183; Computer Engineering &#183; Ankara</text>

  <!-- chips -->
  <g class="mono" font-size="13">
    <rect x="70" y="218" width="80" height="32" rx="16" fill="rgba(88,230,217,0.08)" stroke="rgba(88,230,217,0.35)"/>
    <text x="110" y="239" fill="#58e6d9" text-anchor="middle">C / C++</text>

    <rect x="162" y="218" width="74" height="32" rx="16" fill="rgba(124,140,255,0.08)" stroke="rgba(124,140,255,0.4)"/>
    <text x="199" y="239" fill="#7c8cff" text-anchor="middle">Python</text>

    <rect x="248" y="218" width="80" height="32" rx="16" fill="rgba(88,230,217,0.08)" stroke="rgba(88,230,217,0.35)"/>
    <text x="288" y="239" fill="#58e6d9" text-anchor="middle">Edge AI</text>

    <rect x="340" y="218" width="60" height="32" rx="16" fill="rgba(124,140,255,0.08)" stroke="rgba(124,140,255,0.4)"/>
    <text x="370" y="239" fill="#7c8cff" text-anchor="middle">RTOS</text>

    <rect x="412" y="218" width="74" height="32" rx="16" fill="rgba(88,230,217,0.08)" stroke="rgba(88,230,217,0.35)"/>
    <text x="449" y="239" fill="#58e6d9" text-anchor="middle">TCP/IP</text>

    <rect x="498" y="218" width="88" height="32" rx="16" fill="rgba(124,140,255,0.08)" stroke="rgba(124,140,255,0.4)"/>
    <text x="542" y="239" fill="#7c8cff" text-anchor="middle">OR-Tools</text>
  </g>

  <!-- right: terminal card -->
  <g>
    <rect x="752" y="52" width="386" height="196" rx="12" fill="#0f1520" stroke="#1f2a3c" stroke-width="1.5"/>
    <circle cx="778" cy="78" r="5.5" fill="#ff5f5f" opacity="0.85"/>
    <circle cx="798" cy="78" r="5.5" fill="#fbbc4a" opacity="0.85"/>
    <circle cx="818" cy="78" r="5.5" fill="#34c98e" opacity="0.85"/>
    <text x="945" y="83" class="mono" font-size="12" fill="#8b9bb4" text-anchor="middle">~/kncn23</text>
    <line x1="752" y1="96" x2="1138" y2="96" stroke="#1f2a3c" stroke-width="1.5"/>

    <g class="mono" font-size="14">
      <text x="776" y="127"><tspan fill="#58e6d9">$</tspan><tspan fill="#d6e2f0"> ./profile --summary</tspan></text>
      <text x="776" y="153"><tspan fill="#7c8cff">&#10095;</tspan><tspan fill="#8b9bb4"> focus: edge AI &#183; embedded sw</tspan></text>
      <text x="776" y="179"><tspan fill="#7c8cff">&#10095;</tspan><tspan fill="#8b9bb4"> edu: Ba&#351;kent University &#183; '26</tspan></text>
      <text x="776" y="205"><tspan fill="#7c8cff">&#10095;</tspan><tspan fill="#8b9bb4"> site: kncn23.github.io</tspan></text>
    </g>
    <rect x="776" y="218" width="9" height="17" fill="#58e6d9" class="cursor"/>
  </g>
</svg>
