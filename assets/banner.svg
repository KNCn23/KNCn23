  <!-- footer rule -->
  <line x1="28" y1="278" x2="1172" y2="278" stroke="#d8d2c6"/>
  <text x="28" y="293" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459">kncn23.github.io</text>
  <text x="1172" y="293" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459" text-anchor="end">SHEET 1 / 1</text>
