<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ata Kaan Can Olcay — Embedded Systems and Edge-AI Software">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .cond { font-family: 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    @keyframes pulse { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    .live { animation: pulse 2s step-end infinite; }
  </style>

  <!-- sheet -->
  <rect x="0.5" y="0.5" width="1199" height="299" fill="#f6f3ec" stroke="#14161a"/>

  <!-- document header -->
  <rect x="1" y="1" width="1198" height="42" fill="#14161a"/>
  <text x="28" y="28" class="mono" font-size="13" letter-spacing="2.2" fill="#f6f3ec">AKO &#183; ATA KAAN CAN OLCAY</text>
  <text x="1172" y="28" class="mono" font-size="12" letter-spacing="1.8" fill="#9c958a" text-anchor="end">AKO-2026 &#183; REV 2026.10</text>

  <!-- left: title block -->
  <rect x="28" y="72" width="9" height="9" fill="#c24c1b"/>
  <text x="50" y="81" class="mono" font-size="12" letter-spacing="2" fill="#6b6459">BILGISAYAR M&#220;HEND&#304;S&#304; &#183; COMPUTER ENGINEER &#183; ANKARA</text>

  <text x="26" y="132" class="cond" font-size="42" font-weight="700" fill="#14161a"
        textLength="636" lengthAdjust="spacingAndGlyphs">EMBEDDED SYSTEMS &amp; EDGE-AI</text>
  <text x="28" y="164" class="mono" font-size="14" fill="#3a3d44"
        textLength="420" lengthAdjust="spacingAndGlyphs">Software at the layer closest to the hardware.</text>

  <!-- parameter strip -->
  <g>
    <rect x="28.5" y="196.5" width="639" height="62" fill="#fffdf8" stroke="#14161a"/>
    <line x1="188" y1="197" x2="188" y2="258" stroke="#d8d2c6"/>
    <line x1="348" y1="197" x2="348" y2="258" stroke="#d8d2c6"/>
    <line x1="508" y1="197" x2="508" y2="258" stroke="#d8d2c6"/>

    <text x="46" y="219" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459">FOCUS</text>
    <text x="46" y="243" class="mono" font-size="13" fill="#14161a">Edge AI / RTOS</text>

    <text x="206" y="219" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459">LANGUAGES</text>
    <text x="206" y="243" class="mono" font-size="13" fill="#14161a">C &#183; C++ &#183; Python</text>

    <text x="366" y="219" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459">GRADUATION</text>
    <text x="366" y="243" class="mono" font-size="13" fill="#14161a">2027</text>

    <text x="526" y="219" class="mono" font-size="10" letter-spacing="1.8" fill="#6b6459">STATUS</text>
    <circle cx="531" cy="238" r="4" fill="#c24c1b" class="live"/>
    <text x="544" y="243" class="mono" font-size="13" fill="#14161a">Open to roles</text>
  </g>

  <!-- right: component figure -->
  <g>
    <rect x="712.5" y="72.5" width="459" height="186" fill="#fffdf8" stroke="#14161a"/>
    <line x1="713" y1="104" x2="1171" y2="104" stroke="#14161a"/>
    <text x="730" y="93" class="mono" font-size="11" letter-spacing="1.6" fill="#14161a">FIG. 1 &#8212; CAPABILITY MAP</text>
    <text x="1154" y="93" class="mono" font-size="11" letter-spacing="1.6" fill="#6b6459" text-anchor="end">TOP VIEW</text>

    <g stroke="#14161a">
      <path d="M790 139h48M790 167h48M790 195h48M790 223h48"/>
      <path d="M1033 139h48M1033 167h48M1033 195h48M1033 223h48"/>
    </g>

    <rect x="838" y="124" width="195" height="114" fill="#14161a"/>
    <path d="M916 124a20 20 0 0 0 40 0" fill="#fffdf8"/>
    <circle cx="851" cy="137" r="3.5" fill="#c24c1b"/>
    <text x="936" y="179" class="mono" font-size="14" letter-spacing="1.4" fill="#f6f3ec" text-anchor="middle">AKO-01</text>
    <text x="936" y="198" class="mono" font-size="9" letter-spacing="2" fill="#9c958a" text-anchor="middle">EMBEDDED</text>

    <g class="mono" font-size="9.5" fill="#14161a" text-anchor="end">
